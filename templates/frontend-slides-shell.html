<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartDrain Presentation</title>
  <style>
    :root {
      --navy: #0f2233;
      --charcoal: #18212b;
      --slate: #526273;
      --muted: #8a98a8;
      --bg: #f5f7fa;
      --paper: #ffffff;
      --teal: #0e8793;
      --orange: #f59e0b;
      --red: #e5484d;
      --gray: #b7c0ca;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111827; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--navy); }
    .deck { width: 100vw; height: 100vh; display: grid; place-items: center; overflow: hidden; }
    .slide {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: var(--bg);
      padding: 56px 64px;
      display: none;
      position: relative;
      overflow: hidden;
    }
    .slide.active { display: block; }
    .slide h1 { font-size: 56px; line-height: 1.05; margin: 0 0 20px; letter-spacing: -0.04em; }
    .slide h2 { font-size: 42px; margin: 0 0 16px; letter-spacing: -0.035em; }
    .slide p { font-size: 24px; line-height: 1.55; color: var(--slate); }
    .section { background: var(--navy); color: white; }
    .section p { color: #d7e4ec; }
    .counter { position: absolute; right: 32px; bottom: 24px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="deck">
    <section class="slide active">
      <h1>우수주의보</h1>
      <p>이미지·센서 기반 빗물받이 위험도 모니터링</p>
      <div class="counter"></div>
    </section>
    <section class="slide section">
      <h2>Section Title</h2>
      <p>Use this shell as a starting point. Replace with final slides.</p>
      <div class="counter"></div>
    </section>
  </main>
  <script>
    const slides = [...document.querySelectorAll('.slide')];
    let current = 0;
    function render() {
      slides.forEach((s, i) => {
        s.classList.toggle('active', i === current);
        const c = s.querySelector('.counter');
        if (c) c.textContent = `${i + 1} / ${slides.length}`;
      });
    }
    function go(n) { current = Math.max(0, Math.min(slides.length - 1, n)); render(); }
    window.addEventListener('keydown', (e) => {
      if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) go(current + 1);
      if (['ArrowLeft', 'PageUp'].includes(e.key)) go(current - 1);
      if (e.key === 'Home') go(0);
      if (e.key === 'End') go(slides.length - 1);
    });
    render();
  </script>
</body>
</html>
